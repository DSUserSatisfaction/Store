<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — North & Pine</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/responsive.css"></head><body><div id="announcement" class="announcement"></div><header class="site-header" id="site-header"></header><main class="section"><div class="container"><span class="eyebrow">Contact</span><h1>How can we help?</h1><div class="contact-grid"><div class="legal-box"><h2>Customer care</h2><p id="contact-details"></p></div><form class="checkout-form" data-newsletter><div class="form-grid"><label class="full">Name<input required></label><label class="full">Email<input type="email" required></label><label class="full">Message<textarea required></textarea></label></div><button class="btn btn-primary" type="submit">Send demo message</button></form></div></div></main><div id="site-footer"></div><div id="shared-overlays"></div><script src="./config.js"></script><script src="./products.js"></script><script src="./js/main.js"></script><script src="./js/store.js"></script><script>window.addEventListener("load",()=>{const c=window.STORE_CONFIG.contact;document.querySelector("#contact-details").innerHTML=`${c.address}<br><a href="mailto:${c.email}">${c.email}</a><br>${c.phone}<br><small>Demo contact details.</small>`})</script></body></html>
