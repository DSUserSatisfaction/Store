<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — North & Pine</title><meta name="description" content="Shop considered outdoor and everyday goods from North & Pine."><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/responsive.css"></head>
<body>
<a class="skip-link" href="#main">Skip to content</a><div id="announcement" class="announcement"></div><header class="site-header" id="site-header"></header>
<main id="main" class="section"><div class="container"><div class="section-heading"><div><span class="eyebrow">The collection</span><h2>Shop all goods</h2></div><span id="product-count"></span></div>
<div class="catalog-layout"><aside class="filters" aria-label="Catalog filters"><input id="catalog-search" type="search" placeholder="Search products" aria-label="Search products"><h3>Category</h3><div id="category-filters"></div><h3>Price</h3><label>Minimum <input id="min-price" type="number" min="0"></label><label>Maximum <input id="max-price" type="number" min="0"></label><h3>Rating</h3><select id="rating-filter"><label></label><option value="0">All ratings</option><option value="4">4 stars & up</option><option value="4.5">4.5 stars & up</option></select><label><input id="sale-filter" type="checkbox"> On sale</label><label><input id="new-filter" type="checkbox"> New arrivals</label><label><input id="bestseller-filter" type="checkbox"> Bestsellers</label><button id="clear-filters" class="btn btn-secondary" type="button">Clear all filters</button></aside>
<section><div class="catalog-toolbar"><label for="sort-select">Sort</label><select id="sort-select"><option value="featured">Featured</option><option value="recommended">Recommended</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option><option value="rating">Highest rated</option><option value="reviewed">Most reviewed</option><option value="newest">Newest</option><option value="az">Alphabetical A-Z</option><option value="za">Alphabetical Z-A</option></select><span><span id="active-filter-count">0</span> active</span></div><div class="product-grid" id="catalog-grid"></div></section></div></div></main>
<div id="site-footer"></div><div id="shared-overlays"></div>
<script src="./config.js"></script><script src="./products.js"></script><script src="./js/main.js"></script><script src="./js/store.js"></script>
</body></html>
