<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — North & Pine</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/responsive.css"></head>
<body><a class="skip-link" href="#main">Skip to content</a><div id="announcement" class="announcement"></div><header class="site-header" id="site-header"></header>
<main id="main" class="section"><div class="container"><div class="section-heading"><div><span class="eyebrow">Secure demo</span><h2>Checkout</h2></div><a class="text-link" href="./shop.html">Return to shop</a></div><div class="demo-notice"><strong>Frontend demonstration.</strong> This checkout does not collect card data, process payments, store personal details, or send orders. Real checkout requires a payment provider plus a backend or ecommerce integration.</div><div class="checkout-grid">
<form class="checkout-form" id="checkout-form"><h3>Customer information</h3><div class="form-grid">
<label>First name<input name="firstName" autocomplete="given-name" required></label><label>Last name<input name="lastName" autocomplete="family-name" required></label><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Phone (optional)<input type="tel" name="phone" autocomplete="tel"></label>
<label class="full">Street address<input name="address" autocomplete="street-address" required></label><label>House number<input name="houseNumber" required></label><label>Postal code<input name="postalCode" autocomplete="postal-code" required></label><label>City<input name="city" autocomplete="address-level2" required></label><label>Country<select name="country" autocomplete="country-name" required><option value="">Select country</option><option>Netherlands</option><option>Belgium</option><option>Germany</option><option>France</option><option>United Kingdom</option></select></label><label class="full">Delivery instructions (optional)<textarea name="instructions"></textarea></label></div><button class="btn btn-primary" type="submit" style="width:100%;margin-top:1rem">Complete demo checkout</button><p id="checkout-confirmation" class="demo-notice" role="status" hidden></p></form>
<aside class="checkout-summary" id="checkout-summary"></aside></div></div></main>
<div id="site-footer"></div><div id="shared-overlays"></div><script src="./config.js"></script><script src="./products.js"></script><script src="./js/main.js"></script><script src="./js/store.js"></script></body></html>
